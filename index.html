<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">Weatherly</h1>
            <p class="app-subtitle">Get live weather for any location</p>
        </header>

        <section class="search-section" aria-label="Weather search form">
            <form id="weatherForm" class="weather-form" novalidate>
                <div class="form-group">
                    <label for="city" class="form-label">City</label>
                    <input 
                        type="text" 
                        id="city" 
                        name="city" 
                        class="form-input"
                        placeholder="Enter city name"
                        autocomplete="address-level2"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="country" class="form-label">Country</label>
                    <input 
                        type="text" 
                        id="country" 
                        name="country" 
                        class="form-input"
                        placeholder="Enter country code or name"
                        autocomplete="country-name"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="apiKey" class="form-label">API Key</label>
                    <input 
                        type="password" 
                        id="apiKey" 
                        name="apiKey" 
                        class="form-input"
                        placeholder="Enter OpenWeatherMap API key"
                        autocomplete="off"
                        required
                        aria-required="true"
                    >
                    <small class="form-hint">
                        Get your API key from <a href="https://openweathermap.org/api" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a>
                    </small>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Get Weather</button>
            </form>
        </section>

        <section class="result-section" aria-live="polite" aria-label="Weather results">
            <div id="errorContainer" class="error-container" role="alert" aria-atomic="true" style="display: none;">
                <p id="errorMessage" class="error-message"></p>
            </div>

            <div id="weatherContainer" class="weather-container" style="display: none;">
                <div class="location">
                    <h2 id="locationName" class="location-name"></h2>
                </div>

                <div class="temperature-section">
                    <div id="temperature" class="temperature"></div>
                    <div class="temperature-unit">°C</div>
                </div>

                <div class="condition-section">
                    <div id="weatherCondition" class="weather-condition"></div>
                    <img id="weatherIcon" class="weather-icon" src="" alt="Weather icon" style="display: none;">
                </div>

                <div class="details-section">
                    <div class="detail-item">
                        <div class="detail-label">Feels like</div>
                        <div id="feelsLike" class="detail-value"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div id="humidity" class="detail-value"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind speed</div>
                        <div id="windSpeed" class="detail-value"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div id="pressure" class="detail-value"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
